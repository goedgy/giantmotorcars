name: Deploy to GitHub Pages

# Publishes the CRM pages at https://goedgy.github.io/giantmotorcars/
# on every push to main. Requires Settings -> Pages -> Source: "GitHub Actions"
# to be selected once.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Static site — the repo root is the site, no build step.
      # enablement asks the API to turn Pages on, but GITHUB_TOKEN is refused
      # ("Resource not accessible by integration") for the initial creation,
      # so Pages still has to be switched on once by hand:
      # Settings -> Pages -> Source: GitHub Actions. It is a no-op after that.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
