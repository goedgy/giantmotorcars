<style>
:root{
  --asphalt:#14171C; --asphalt-2:#1B1F27; --asphalt-3:#242A34;
  --ink:#0F1115; --muted:#6B7280; --muted-2:#9AA3AF;
  --paper:#F4F5F7; --card:#FFFFFF; --line:#E4E7EC; --line-2:#EDEFF3;
  --primary:#047857; --primary-ink:#065F46; --primary-soft:#E7F6F0;
  --shadow:0 1px 2px rgba(16,17,21,.04),0 4px 16px rgba(16,17,21,.06);
  --shadow-lg:0 12px 40px rgba(16,17,21,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:230px 1fr;height:100vh;overflow:hidden}
.side{background:var(--asphalt);color:#fff;display:flex;flex-direction:column;padding:20px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary),#10B981);display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:17px;color:#fff;flex:none}
.brand .bn{font-family:'Space Grotesk';font-weight:600;font-size:15px;line-height:1.15}
.brand .bn small{display:block;font-family:'Inter';font-weight:400;font-size:11px;color:var(--muted-2)}
.appsw{display:flex;gap:4px;background:var(--asphalt-2);border-radius:10px;padding:4px;margin:0 8px 14px}
.appsw a{flex:1;text-align:center;padding:7px 8px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted-2);text-decoration:none;transition:.12s;cursor:pointer}
.appsw a:hover{color:#fff}
.appsw a.on{background:var(--asphalt-3);color:#fff}
.side .stat{background:var(--asphalt-2);border-radius:11px;padding:12px 13px;margin-bottom:9px}
.side .stat .n{font-family:'Space Grotesk';font-weight:700;font-size:22px}
.side .stat .l{font-size:11.5px;color:var(--muted-2);font-weight:500}
.side-foot{margin-top:auto;padding:12px 8px 2px;border-top:1px solid var(--asphalt-3)}
.side-foot .u{display:flex;align-items:center;gap:9px;font-size:13px}
.side-foot .av{width:28px;height:28px;border-radius:50%;background:var(--primary);display:grid;place-items:center;font-weight:600;font-size:12px;color:#fff;flex:none}
.side-foot .lo{color:var(--muted-2);font-size:12px;margin-top:8px}
.side-foot .lo:hover{color:#fff}

.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 24px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar h1{font-family:'Space Grotesk';font-size:19px;font-weight:600;margin:0}
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:38px;min-width:240px}
.search input{border:none;background:none;outline:none;width:100%;color:var(--ink)}
.search svg{color:var(--muted);flex:none}
.spacer{flex:1}
.filter{height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-weight:500;max-width:170px}
.btn-primary{height:38px;padding:0 16px;background:var(--primary);color:#fff;border-radius:10px;font-weight:600;display:flex;align-items:center;gap:7px;transition:.12s}
.btn-primary:hover{background:var(--primary-ink)}
.btn-ghost{height:38px;padding:0 16px;border:1px solid var(--line);border-radius:10px;font-weight:600;color:var(--muted)}
.btn-ghost:hover{background:var(--paper);color:var(--ink)}
.btn-danger{height:38px;padding:0 16px;border:1px solid #FCA5A5;border-radius:10px;font-weight:600;color:#B91C1C;background:#fff}
.btn-danger:hover{background:#FEF2F2}
.demo-flag{background:#FEF3C7;color:#92400E;font-weight:600;font-size:12.5px;padding:7px 24px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #FDE68A}

.content{flex:1;overflow:auto;padding:20px 24px}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:12px 16px;background:var(--paper);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--line-2);font-size:13.5px;vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#FAFBFC;cursor:pointer}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--line-2);color:var(--muted);display:inline-block}
.badge.sc{background:var(--primary-soft);color:var(--primary-ink)}
.badge.co{background:#EEF2FF;color:#4338CA}
.badge.type{background:#F1F5F9;color:#475569}
.badge.recourse{background:#FEF2F2;color:#B91C1C}
.toggle{height:38px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.toggle:hover{border-color:#FCA5A5;color:#B91C1C}
.toggle.on{background:#FEF2F2;border-color:#FCA5A5;color:#B91C1C}

.scrim{position:fixed;inset:0;background:rgba(15,17,21,.5);backdrop-filter:blur(2px);display:grid;place-items:center;padding:20px;z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:600px;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg);animation:pop .18s}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.6}}
.modal-h{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.modal-h h2{font-family:'Space Grotesk';font-size:17px;margin:0}
.modal-h .x{margin-left:auto;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:20px}
.modal-h .x:hover{background:var(--paper);color:var(--ink)}
.modal-b{padding:20px 22px}
.modal-f{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.sec{font-family:'Space Grotesk';font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 8px}
.sec:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.kv .k{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.kv .v{margin-top:2px}

/* full-record editor */
.modal.wide{max-width:780px}
.ein{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;outline:none;background:#fff;margin-top:3px}
.ein:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(4,120,87,.12)}
.echk{display:flex;align-items:center;gap:8px;margin-top:7px;font-weight:500;cursor:pointer}
.echk input{width:16px;height:16px;accent-color:var(--primary);flex:none}
.ehint{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
.edirty{color:var(--primary);font-weight:600}

.statc{flex:1;background:var(--paper);border-radius:11px;padding:14px;text-align:center}
.statc .n{font-family:'Space Grotesk';font-weight:700;font-size:26px}
.statc .l{font-size:12px;color:var(--muted);font-weight:500}

.login{height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#1B1F27,#0C0E12)}
.login .box{background:#fff;border-radius:18px;padding:34px 30px;width:360px;box-shadow:var(--shadow-lg)}
.login .mark{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#10B981);display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:22px;color:#fff;margin-bottom:16px}
.login h1{font-family:'Space Grotesk';font-size:21px;margin:0 0 4px}
.login p{color:var(--muted);margin:0 0 22px;font-size:13.5px}
.login .fld{margin-bottom:13px}
.login label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.login input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;outline:none}
.login input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.login .btn-primary{width:100%;justify-content:center;height:42px;margin-top:6px}
.login .err{color:#DC2626;font-size:13px;margin-top:12px;min-height:18px}

.sorth{cursor:pointer;user-select:none}
.selbar{display:flex;align-items:center;gap:10px;background:var(--primary-soft);border:1px solid #A7F3D0;border-radius:11px;padding:9px 14px;margin-bottom:12px;font-size:13.5px}
.selbar span{margin-right:auto}
@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="messaging.js"></script>
<script src="email-editor.js"></script>
<script src="messaging-ui.js"></script>
<script>
/* ============================================================
   Giant Motor Cars — Sold Customers (Frazer)
   ============================================================ */
const CFG=window.SOLD_CONFIG;
const LIVE=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY);
let sb=LIVE?supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;

const state={user:null,q:'',fType:'',fSC:'',fLien:'',fMonth:'',fRecourse:false,fTag:'',advFilters:[],selected:new Set(),sort:{key:'sale_date',dir:'desc'},rows:[]};

/* ---------- data ---------- */
async function load(){
  if(LIVE){
    let all=[],from=0;const page=1000;
    while(true){
      const {data,error}=await sb.from('sold_customers').select('*').order('sale_date',{ascending:false}).range(from,from+page-1);
      if(error){alert('Load error: '+error.message);return;}
      all=all.concat(data||[]);
      if(!data||data.length<page)break;
      from+=page;
    }
    state.rows=all;
  }
  else state.rows=DEMO.slice();
  render();
}

/* ---------- helpers ---------- */
function userName(){return state.user?.name||'You';}
function initials(n){return (n||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const digits=s=>(s||'').replace(/\D/g,'');
function fullName(r){return [r.first_name,r.last_name].filter(Boolean).join(' ');}
function vehicle(r){return [r.veh_year,r.veh_make,r.veh_model].filter(Boolean).join(' ');}
function fmtDate(d){if(!d)return '';const t=Date.parse(d);if(isNaN(t))return d;const x=new Date(t);return (x.getUTCMonth()+1)+'/'+x.getUTCDate()+'/'+x.getUTCFullYear();}
function monthKey(d){if(!d)return '';const t=Date.parse(d);if(isNaN(t))return '';const x=new Date(t);return x.getUTCFullYear()+'-'+String(x.getUTCMonth()+1).padStart(2,'0');}
function monthLabel(k){if(!k)return '';const [y,m]=k.split('-');return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+y;}
function hasSC(r){return (r.service_contract&&/^y/i.test(r.service_contract))||!!r.service_contract_company;}
function hasCo(r){return !!(r.cobuyer_first||r.cobuyer_last);}
// Lienholders where a missed 1st payment is charged back to the dealer (recourse)
const RECOURSE=['westlake','agora','strike acceptance','shoreham','veros'];
function isRecourse(r){const l=(r.lien_holder||'').toLowerCase();return !!l&&RECOURSE.some(k=>l.includes(k));}
const ADV_FIELDS=[
 {k:'first_name',l:'First name'},{k:'last_name',l:'Last name'},{k:'cell_phone',l:'Cell phone'},{k:'home_phone',l:'Home phone'},{k:'email',l:'Email'},
 {k:'sale_date',l:'Sale date'},{k:'sale_type',l:'Type of sale'},{k:'veh_year',l:'Vehicle year'},{k:'veh_make',l:'Vehicle make'},{k:'veh_model',l:'Vehicle model'},
 {k:'vin',l:'VIN'},{k:'vin_last6',l:'Last 6 VIN'},{k:'first_payment_date',l:'1st payment date'},{k:'note_payment_amount',l:'Payment amount'},
 {k:'pay_schedule',l:'Pay schedule'},{k:'num_payments',l:'Number of payments'},{k:'current_due_date',l:'Current date due'},{k:'service_contract',l:'Service contract'},{k:'service_contract_company',l:'SC company'},
 {k:'lien_holder',l:'Lienholder'},{k:'cobuyer_first',l:'Co-buyer first'},{k:'cobuyer_last',l:'Co-buyer last'},{k:'cobuyer_email',l:'Co-buyer email'},
 {k:'tag_in',l:'Tag in (yes/no)'},{k:'tag_cost',l:'Tag cost'},{k:'tag_number',l:'Tag number'}];
function advVal(r,key){if(key==='tag_in')return r.tag_in?'yes':'no';const v=r[key];return v==null?'':String(v);}
function matchAdv(r,f){const v=advVal(r,f.field).toLowerCase(),q=(f.value||'').toLowerCase();
  switch(f.op){case 'contains':return v.includes(q);case 'equals':return v===q;case 'not_equals':return v!==q;case 'empty':return v==='';case 'not_empty':return v!=='';default:return true;}}
function fmtPhone(s){let d=digits(s);if(d.length===11&&d[0]==='1')d=d.slice(1);if(d.length!==10)return s||'';return '('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6);}
/* Frazer writes amounts as "389.42", "$389.42", "1,234.56" or "(50.00)" for negatives. */
function toMoney(v){
  if(v==null)return null;
  let s=String(v).trim();
  if(!s)return null;
  const neg=/^\(.*\)$/.test(s);
  s=s.replace(/[()]/g,'').replace(/[^0-9.\-]/g,'');
  if(!s||s==='-'||s==='.')return null;
  const n=parseFloat(s);
  if(isNaN(n))return null;
  return Math.round((neg?-n:n)*100)/100;
}
const MONEY_FMT=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
function fmtMoney(v){const n=toMoney(v);return n==null?'':MONEY_FMT.format(n);}
function toInt(v){if(v==null)return null;const s=String(v).replace(/[^0-9\-]/g,'');if(!s||s==='-')return null;const n=parseInt(s,10);return isNaN(n)?null:n;}
/* "Weekly"/"Bi-Weekly"/"Monthly" — used in sentences, so lowercase it. */
function schedWord(s){const v=String(s||'').trim().toLowerCase();
  if(!v)return '';
  if(/bi.?week|every other week|semi.?month/.test(v))return 'bi-weekly';
  if(/week/.test(v))return 'weekly';
  if(/month/.test(v))return 'monthly';
  if(/semi.?month|twice/.test(v))return 'semi-monthly';
  return v;}
function bestPhone(r){return fmtPhone(r.cell_phone||r.home_phone);}

function distinct(fn){return [...new Set(state.rows.map(fn).filter(Boolean))].sort();}
function months(){return [...new Set(state.rows.map(r=>monthKey(r.sale_date)).filter(Boolean))].sort().reverse();}

function filtered(){
  const q=state.q.toLowerCase();
  return state.rows.filter(r=>{
    if(state.fType&&r.sale_type!==state.fType)return false;
    if(state.fSC==='yes'&&!hasSC(r))return false;
    if(state.fSC==='no'&&hasSC(r))return false;
    if(state.fLien&&r.lien_holder!==state.fLien)return false;
    if(state.fMonth&&monthKey(r.sale_date)!==state.fMonth)return false;
    if(state.fRecourse&&!isRecourse(r))return false;
    if(state.fTag==='pending'&&r.tag_in)return false;
    if(state.fTag==='in'&&!r.tag_in)return false;
    if(state.advFilters.length&&!state.advFilters.every(f=>matchAdv(r,f)))return false;
    if(q){const hay=[fullName(r),r.cell_phone,r.home_phone,r.email,vehicle(r),r.vin,r.vin_last6,r.lien_holder,fullName({first_name:r.cobuyer_first,last_name:r.cobuyer_last})].join(' ').toLowerCase();
      if(!hay.includes(q))return false;}
    return true;
  });
}

/* ---------- render ---------- */
function contentHTML(){
  const rows=filtered();
  let bar='';
  if(state.selected.size){
    const withEmail=state.rows.filter(r=>state.selected.has(r.id)&&r.email&&!r.email_opt_out).length;
    bar=`<div class="selbar"><span><b>${state.selected.size}</b> selected</span>
    <button class="btn-primary" style="height:32px" onclick="emailSelected()">
      ✉ Email ${withEmail||''} ${withEmail===1?'customer':'customers'}</button>
    <button class="btn-ghost" style="height:32px" onclick="exportCSV('selected')">Export selected</button>
    <button class="btn-ghost" style="height:32px" onclick="clearSel()">Clear</button></div>`;}
  return bar+table(rows);
}
function renderContent(){const el=document.getElementById('content');if(el)el.innerHTML=contentHTML();}
function toggleSel(id,e){e.stopPropagation();if(state.selected.has(id))state.selected.delete(id);else state.selected.add(id);renderContent();}
function toggleSelAll(e){e.stopPropagation();const rows=filtered();const all=rows.length&&rows.every(r=>state.selected.has(r.id));
  if(all)rows.forEach(r=>state.selected.delete(r.id));else rows.forEach(r=>state.selected.add(r.id));renderContent();}
function clearSel(){state.selected.clear();renderContent();}

/* ---------- email ---------- */
function emailSelected(){
  const recs=state.rows.filter(r=>state.selected.has(r.id));
  if(!recs.length)return;
  GMCUI.openCompose(recs);
}
function emailOne(idx){
  const r=state.rows[idx];if(!r)return;
  if(!r.email)return alert(`${fullName(r)||'This customer'} has no email address on file.`);
  GMCUI.openCompose([r]);
}
function render(){
  if(LIVE&&!state.user)return renderLogin();
  const rows=filtered();
  const now=new Date();const thisMonth=now.getUTCFullYear()+'-'+String(now.getUTCMonth()+1).padStart(2,'0');
  const mCount=state.rows.filter(r=>monthKey(r.sale_date)===thisMonth).length;
  const yCount=state.rows.filter(r=>monthKey(r.sale_date).startsWith(String(now.getUTCFullYear()))).length;
  const scRate=state.rows.length?Math.round(100*state.rows.filter(hasSC).length/state.rows.length):0;
  const recCount=state.rows.filter(isRecourse).length;

  document.getElementById('root').innerHTML=`
  <div class="app">
    <aside class="side">
      <div class="brand"><div class="mark">G</div>
        <div class="bn">${esc(CFG.DEALER_NAME)}<small>Sold Customers</small></div></div>
      <div class="appsw">
        <a href="${esc(CFG.LEADS_URL||'index.html')}">Leads</a>
        <a class="on">Sold</a>
        <a href="${esc(CFG.BLAST_URL||'blast.html')}">Blast</a>
      </div>
      <div class="stat"><div class="n">${state.rows.length}</div><div class="l">Total sold</div></div>
      <div class="stat"><div class="n">${mCount}</div><div class="l">Sold this month</div></div>
      <div class="stat"><div class="n">${yCount}</div><div class="l">Sold this year</div></div>
      <div class="stat"><div class="n">${scRate}%</div><div class="l">Service contract attach</div></div>
      <div class="stat" style="cursor:pointer" onclick="state.fRecourse=!state.fRecourse;render()"><div class="n" style="color:#F87171">${recCount}</div><div class="l">1st-payment recourse</div></div>
      <div class="side-foot"><div class="u"><div class="av">${initials(userName())}</div>
        <div style="font-weight:600">${esc(userName())}</div></div>
        ${LIVE?`<div class="lo" onclick="logout()">Sign out</div>`:''}</div>
    </aside>
    <div class="main">
      <div class="topbar">
        <h1>Sold Customers</h1>
        <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
          <input placeholder="Search name, VIN, phone, lienholder…" value="${esc(state.q)}" oninput="state.q=this.value;renderContent()"></div>

function sortVal(r,k){switch(k){
  case 'name':return (r.last_name+' '+r.first_name).toLowerCase();
  case 'vehicle':return vehicle(r).toLowerCase();
  case 'sale_date':return Date.parse(r.sale_date)||0;
  case 'type':return (r.sale_type||'').toLowerCase();
  case 'payment':return Date.parse(r.first_payment_date)||0;
  case 'sc':return hasSC(r)?1:0;
  case 'lien':return (r.lien_holder||'').toLowerCase();
  case 'tag':return r.tag_in?1:0;
  default:return 0;
}}

/* Dates arrive as '2026-07-28' or a full ISO stamp; <input type=date> wants the former. */
function toDateInput(v){
  if(!v)return '';
  const m=String(v).match(/^(\d{4}-\d{2}-\d{2})/);
  if(m)return m[1];
  const t=Date.parse(v);
  if(isNaN(t))return '';
  const d=new Date(t);
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
}

/* One canonical shape per type, so "no change" compares reliably
   ('' vs null, 512 vs '512.00', 'Yes' vs 'yes '). */
function normField(f,v){
  switch(f.t){
    case 'bool':  return !!v;
    case 'money': return toMoney(v);
    case 'date':  return toDateInput(v);
    default:      return v==null?'':String(v).trim();
  }
}

function editRowHtml(f,r){
  const id='e_'+f.k;
  const cur=r[f.k];
  const hint=f.hint?`<div class="ehint">${esc(f.hint)}</div>`:'';
  if(f.t==='bool'){
    return `<div class="kv"><div class="k">${esc(f.l)}</div>
      <label class="echk"><input type="checkbox" id="${id}" ${cur?'checked':''}> ${esc(f.cl||f.l)}</label>${hint}</div>`;
  }
  if(f.t==='yesno'){
    const v=(cur==null?'':String(cur)).trim();
    const isY=/^y/i.test(v),isN=/^n/i.test(v);
    return `<div class="kv"><div class="k">${esc(f.l)}</div>
      <select class="ein" id="${id}">
        <option value="" ${!isY&&!isN?'selected':''}>—</option>
        <option value="Yes" ${isY?'selected':''}>Yes</option>
        <option value="No" ${isN?'selected':''}>No</option>
      </select>${hint}</div>`;
  }
  if(f.t==='date'){
    return `<div class="kv"><div class="k">${esc(f.l)}</div>
      <input class="ein" type="date" id="${id}" value="${esc(toDateInput(cur))}">${hint}</div>`;
  }
  if(f.t==='money'){
    const n=toMoney(cur);
    return `<div class="kv"><div class="k">${esc(f.l)}</div>
      <input class="ein" id="${id}" inputmode="decimal" placeholder="0.00" value="${n==null?'':n.toFixed(2)}">${hint}</div>`;
  }
  if(f.t==='list'){
    const opts=(f.list?f.list():[]).filter(Boolean);
    return `<div class="kv"><div class="k">${esc(f.l)}</div>
      <input class="ein" id="${id}" list="dl_${f.k}" value="${esc(cur==null?'':cur)}">
      <datalist id="dl_${f.k}">${opts.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>${hint}</div>`;
  }
  return `<div class="kv"><div class="k">${esc(f.l)}</div>
    <input class="ein" type="${f.t==='email'?'email':f.t==='tel'?'tel':'text'}" id="${id}" value="${esc(cur==null?'':cur)}">${hint}</div>`;
}

async function saveEdit(idx){
  const r=state.rows[idx];if(!r)return;

  const next={};
  EDIT_FIELDS.forEach(f=>{
    const el=document.getElementById('e_'+f.k);
    if(!el)return;
    next[f.k]=normField(f,f.t==='bool'?el.checked:el.value);
  });

  // A 17-character VIN already contains the last 6; don't make anyone retype it.
  if(next.vin&&!next.vin_last6)next.vin_last6=String(next.vin).slice(-6).toUpperCase();

  const patch={},changed=[];
  EDIT_FIELDS.forEach(f=>{
    if(!(f.k in next))return;
    const before=normField(f,r[f.k]),after=next[f.k];
    if(before===after)return;
    patch[f.k]=(after===''?null:after);
    changed.push(f.l);
  });

  if(!changed.length){toast('Nothing changed');return openDetail(idx);}

  if(patch.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(patch.email)
     &&!confirm(`"${patch.email}" doesn't look like a valid email address.\n\nSave it anyway? Emails to this customer will be skipped.`))return;

  if(LIVE){
    const {error}=await sb.from('sold_customers').update(patch).eq('id',r.id);
    if(error){
      // An unknown column means the schema script hasn't been run yet.
      const miss=/column "?([a-z_]+)"? of relation|could not find the '([a-z_]+)' column/i.exec(error.message);
      return alert('Save error: '+error.message+(miss?`\n\nThat column doesn't exist in Supabase yet — run the setup SQL from gmail-setup.md.`:''));
    }
  }
  Object.assign(r,patch);
  toast(changed.length===1?`${changed[0]} updated`:`${changed.length} fields updated`);
  render();
  openDetail(idx);
}

function parseCSV(text){const rows=[];let i=0,f='',row=[],q=false;text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  while(i<text.length){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i+=2;continue;}q=false;i++;continue;}f+=c;i++;continue;}
    if(c==='"'){q=true;i++;continue;}
    if(c===','){row.push(f);f='';i++;continue;}
    if(c==='\n'){row.push(f);rows.push(row);f='';row=[];i++;continue;}
    f+=c;i++;}
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));}
function loadSavedMap(){try{return JSON.parse(localStorage.getItem('gmc_frazer_map')||'null');}catch(e){return null;}}
function saveMap(){try{const o={};Object.entries(imp.map).forEach(([k,idx])=>{if(idx!==''&&idx!=null)o[k]=imp.headers[+idx];});localStorage.setItem('gmc_frazer_map',JSON.stringify(o));}catch(e){}}
function autoMap(){
  imp.map={};const used=new Set();
  const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  const H=imp.headers.map(norm);
  FIELDS.forEach(f=>{for(let i=0;i<H.length;i++){if(!used.has(i)&&f.syn.includes(H[i])){imp.map[f.key]=String(i);used.add(i);break;}}});
  FIELDS.forEach(f=>{if(imp.map[f.key]!=null)return;for(let i=0;i<H.length;i++){if(!used.has(i)&&f.syn.some(s=>H[i].includes(s))){imp.map[f.key]=String(i);used.add(i);break;}}});
  const saved=loadSavedMap();if(saved)Object.entries(saved).forEach(([k,name])=>{const i=imp.headers.indexOf(name);if(i>=0)imp.map[k]=String(i);});
}
function isFrazer(rows){const h=(rows[0]||[]).map(c=>String(c).toLowerCase().trim());return h.includes('sale date')&&(h.includes('vehicle vin')||h.includes('last 6 vin'));}

function onFile(file){const isX=/\.(xlsx|xls|xlsm)$/i.test(file.name);const r=new FileReader();

  if(isX)r.readAsArrayBuffer(file);else r.readAsText(file);}

function rowVal(row,key){const idx=imp.map[key];return(idx===undefined||idx===''||idx==null)?'':String(row[+idx]||'').trim();}
function toISO(s){const t=Date.parse(s);if(isNaN(t))return s||null;const d=new Date(t);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');}
function buildRec(row){
  const vin=rowVal(row,'vin').toUpperCase();
  return {first_name:rowVal(row,'first_name'),last_name:rowVal(row,'last_name'),
    home_phone:rowVal(row,'home_phone'),cell_phone:rowVal(row,'cell_phone'),email:rowVal(row,'email').toLowerCase(),
    sale_date:toISO(rowVal(row,'sale_date')),sale_type:rowVal(row,'sale_type'),
    veh_year:rowVal(row,'veh_year'),veh_make:rowVal(row,'veh_make'),veh_model:rowVal(row,'veh_model'),
    vin,vin_last6:rowVal(row,'vin_last6')||(vin?vin.slice(-6):''),
    first_payment_date:toISO(rowVal(row,'first_payment_date')),
    note_payment_amount:toMoney(rowVal(row,'note_payment_amount')),
    pay_schedule:rowVal(row,'pay_schedule'),
    num_payments:toInt(rowVal(row,'num_payments')),
    current_due_date:toISO(rowVal(row,'current_due_date')),
    service_contract:rowVal(row,'service_contract'),service_contract_company:rowVal(row,'service_contract_company'),
    lien_holder:rowVal(row,'lien_holder'),
    cobuyer_first:rowVal(row,'cobuyer_first'),cobuyer_last:rowVal(row,'cobuyer_last'),
    cobuyer_home_phone:rowVal(row,'cobuyer_home_phone'),cobuyer_email:rowVal(row,'cobuyer_email').toLowerCase()};
}
function matchExisting(r){
  if(!r.vin)return null;
  const key=r.vin.toUpperCase()+'|'+(r.last_name||'').toLowerCase();
  return state.rows.find(x=>(x.vin||'').toUpperCase()+'|'+(x.last_name||'').toLowerCase()===key)||null;
}
/* ---------- merging into records that already exist ----------
   Rule: the file may FILL a field that is currently empty, but it never
   replaces a value you already have. Tag info is not in the import at all,
   so it can't be touched.                                                */
const MERGE_FIELDS=['first_name','last_name','home_phone','cell_phone','email','sale_date','sale_type',
  'veh_year','veh_make','veh_model','vin','vin_last6','first_payment_date','note_payment_amount',
  'pay_schedule','num_payments','current_due_date','service_contract','service_contract_company',
  'lien_holder','cobuyer_first','cobuyer_last','cobuyer_home_phone','cobuyer_email'];
/* Values that legitimately move as payments are made. Only refreshed when
   you tick the box — otherwise they'd freeze at whatever imported first. */
const REFRESH_FIELDS=['current_due_date'];
const FIELD_LABEL=Object.fromEntries(FIELDS.map(f=>[f.key,f.label]));

function isBlank(v){return v==null||v===''||(typeof v==='string'&&!v.trim());}
function sameVal(a,b){
  if(a instanceof Date||b instanceof Date)return String(a)===String(b);
  if(typeof a==='number'||typeof b==='number'){const x=toMoney(a),y=toMoney(b);return x===y;}
  return String(a??'').trim()===String(b??'').trim();
}
/* Returns {field:newValue} for everything this row can safely add. */
function diffExisting(ex,inc,refresh){
  const patch={};
  MERGE_FIELDS.forEach(k=>{
    const nv=inc[k];
    if(isBlank(nv))return;                                  // file has nothing to offer
    if(isBlank(ex[k])){patch[k]=nv;return;}                 // fill the gap
    if(refresh&&REFRESH_FIELDS.includes(k)&&!sameVal(ex[k],nv))patch[k]=nv;
  });
  return patch;
}
function fmtVal(k,v){
  if(k==='note_payment_amount')return fmtMoney(v);
  if(/date/.test(k))return fmtDate(v);
  return String(v??'');
}

function buildPreview(){
  const news=[],ups=[];let dupInFile=0;const seen=new Set();
  imp.rows.forEach(row=>{const r=buildRec(row);if(!r.first_name&&!r.last_name&&!r.vin)return;
    const ex=matchExisting(r);if(ex){r._ex=ex;r._patch=diffExisting(ex,r,imp.refresh);ups.push(r);return;}
    const key=(r.vin||'').toUpperCase()+'|'+(r.last_name||'').toLowerCase();
    if(r.vin&&seen.has(key)){dupInFile++;return;}
    if(r.vin)seen.add(key);
    news.push(r);});
  imp.preview={news,ups,dupInFile};
  const sample=news.slice(0,7);

  /* what the merge would add, tallied by field */
  const toMerge=ups.filter(r=>Object.keys(r._patch).length);
  const byField={};
  toMerge.forEach(r=>Object.keys(r._patch).forEach(k=>{byField[k]=(byField[k]||0)+1;}));
  const fieldRows=Object.entries(byField).sort((a,b)=>b[1]-a[1]);
  const unchanged=ups.length-toMerge.length;

  modal(`
   <div class="modal-h"><h2>Review import</h2><button class="x" onclick="closeModal()">×</button></div>

       <div class="statc"><div class="n" style="color:${toMerge.length?'#B45309':'var(--muted)'}">${toMerge.length}</div><div class="l">To fill in</div></div>
       <div class="statc"><div class="n" style="color:var(--muted)">${unchanged}</div><div class="l">Unchanged</div></div>
       ${dupInFile?`<div class="statc"><div class="n" style="color:var(--muted)">${dupInFile}</div><div class="l">Dupes in file</div></div>`:''}</div>

     ${ups.length?`<div style="border:1px solid ${toMerge.length?'#FDE68A':'var(--line)'};background:${toMerge.length?'#FFFBEB':'var(--paper)'};border-radius:11px;padding:13px 15px;margin-bottom:16px">
       ${toMerge.length?`
         <div style="font-weight:600;font-size:13.5px;color:#92400E;margin-bottom:4px">
           Filling in ${fieldRows.reduce((a,b)=>a+b[1],0)} empty field${fieldRows.reduce((a,b)=>a+b[1],0)===1?'':'s'} across ${toMerge.length} existing record${toMerge.length===1?'':'s'}</div>
         <div style="font-size:12.5px;color:#92400E;margin-bottom:10px">Existing values are never replaced — only blanks get filled.</div>
         <table style="width:100%;font-size:13px"><tbody>
         ${fieldRows.map(([k,n])=>`<tr>
           <td style="padding:3px 0;border:none">${esc(FIELD_LABEL[k]||k)}</td>
           <td style="padding:3px 0;border:none;text-align:right;font-weight:600;color:#92400E">${n} record${n===1?'':'s'}</td></tr>`).join('')}
         </tbody></table>
         <details style="margin-top:9px">
           <summary style="cursor:pointer;font-size:12.5px;font-weight:600;color:#92400E">See which customers</summary>
           <div style="margin-top:7px;font-size:12.5px;max-height:170px;overflow:auto">
             ${toMerge.slice(0,40).map(r=>`<div style="padding:3px 0">
               <b>${esc(fullName(r))||'—'}</b> — ${Object.entries(r._patch).map(([k,v])=>`${esc(FIELD_LABEL[k]||k)} <span style="color:#065F46">${esc(fmtVal(k,v))||'(set)'}</span>`).join(', ')}
             </div>`).join('')}
             ${toMerge.length>40?`<div style="color:var(--muted);padding-top:5px">+ ${toMerge.length-40} more</div>`:''}
           </div></details>`
       :`<div style="font-size:13px;color:var(--muted)">All ${ups.length} matching record${ups.length===1?'':'s'} already have everything this file provides — nothing to fill in.</div>`}
       <label style="display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:10px;border-top:1px solid ${toMerge.length?'#FDE68A':'var(--line)'};font-size:12.5px;cursor:pointer">
         <input type="checkbox" ${imp.refresh?'checked':''} onchange="imp.refresh=this.checked;buildPreview()" style="width:15px;height:15px;accent-color:var(--primary)">
         <span>Also refresh <b>Current date due</b> on existing records — it moves as payments are made, so it goes stale otherwise. This one <i>does</i> overwrite.</span>
       </label>
     </div>`:''}

     ${sample.length?`<div style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px">New sales</div>
     <div class="tablewrap"><table><thead><tr><th>Customer</th><th>Vehicle</th><th>Sale Date</th><th>Payment</th><th>Lienholder</th></tr></thead><tbody>
       ${sample.map(r=>`<tr><td style="font-weight:600">${esc(fullName(r))||'—'}</td><td>${esc(vehicle(r))||'—'}<div class="mono" style="color:var(--muted);font-size:11px">${esc(r.vin_last6?'…'+r.vin_last6:'')}</div></td><td class="mono">${esc(fmtDate(r.sale_date))}</td><td class="mono">${esc(fmtMoney(r.note_payment_amount))||'<span style="color:var(--muted)">—</span>'}</td><td>${esc(r.lien_holder)||'—'}</td></tr>`).join('')}

     <button class="btn-primary" onclick="commitImport()" ${(news.length||toMerge.length)?'':'disabled style="opacity:.5"'}>
       ${[news.length?`Import ${news.length}`:'',toMerge.length?`Update ${toMerge.length}`:''].filter(Boolean).join(' · ')||'Nothing to do'}</button></div>`);

async function commitImport(){
  const {news,ups}=imp.preview;
  const merges=(ups||[]).filter(r=>Object.keys(r._patch||{}).length);
  if(!news.length&&!merges.length){closeModal();return;}

  let inserted=news.length,failedInsert=0,merged=0,failedMerge=0;

  if(LIVE){
    if(news.length){
      const payload=news.map(({_ex,_patch,...r})=>r);
      const {error}=await sb.from('sold_customers').insert(payload);
      if(error){
        // Fall back to one at a time so a single bad row can't sink the batch.
        inserted=0;
        for(const r of payload){const {error:e}=await sb.from('sold_customers').insert(r);e?failedInsert++:inserted++;}
      }
    }
    for(const r of merges){
      const {error}=await sb.from('sold_customers').update(r._patch).eq('id',r._ex.id);
      if(error){failedMerge++;console.warn('merge failed',r._ex.id,error.message);}
      else{Object.assign(r._ex,r._patch);merged++;}
    }
  }else{
    news.forEach(r=>{const {_ex,_patch,...rec}=r;rec.id='s'+Date.now()+Math.random().toString(36).slice(2,6);state.rows.push(rec);});
    merges.forEach(r=>{Object.assign(r._ex,r._patch);merged++;});
  }

  saveMap();closeModal();await load();
  const bits=[];
  if(inserted)     bits.push(`Imported ${inserted}`);
  if(merged)       bits.push(`filled in ${merged} existing`);
  if(failedInsert) bits.push(`skipped ${failedInsert} duplicate${failedInsert===1?'':'s'}`);
  if(failedMerge)  bits.push(`${failedMerge} update${failedMerge===1?'':'s'} failed`);
  toast(bits.join(' · ')||'Nothing changed');
}

function openAdvFilter(){if(!state.advFilters.length)state.advFilters=[{field:'lien_holder',op:'contains',value:''}];renderAdvModal();}
function renderAdvModal(){
  const fo=f=>ADV_FIELDS.map(x=>`<option value="${x.k}" ${f.field===x.k?'selected':''}>${x.l}</option>`).join('');
  const oo=f=>[['contains','contains'],['equals','equals'],['not_equals','does not equal'],['empty','is empty'],['not_empty','is not empty']].map(o=>`<option value="${o[0]}" ${f.op===o[0]?'selected':''}>${o[1]}</option>`).join('');
  const isEmptyOp=op=>op==='empty'||op==='not_empty';
  modal(`
   <div class="modal-h"><h2>Advanced filter</h2><button class="x" onclick="closeModal()">×</button></div>
   <div class="modal-b"><p style="color:var(--muted);margin-top:0;font-size:13px">Show records where <b>all</b> of these are true:</p>
     ${state.advFilters.map((f,i)=>`<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center">
       <select onchange="state.advFilters[${i}].field=this.value" style="flex:1.2;padding:8px;border:1px solid var(--line);border-radius:8px">${fo(f)}</select>
       <select onchange="advOp(${i},this.value)" style="width:150px;padding:8px;border:1px solid var(--line);border-radius:8px">${oo(f)}</select>
       <input value="${esc(f.value||'')}" ${isEmptyOp(f.op)?'disabled style="opacity:.4;"':''} oninput="state.advFilters[${i}].value=this.value" placeholder="value" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:8px">
       <button class="btn-ghost" style="height:34px;padding:0 11px" onclick="advRemove(${i})">✕</button></div>`).join('')}
     <button class="btn-ghost" style="height:34px;margin-top:4px" onclick="advAdd()">+ Add condition</button>
   </div>
   <div class="modal-f"><button class="btn-ghost" onclick="advClear()">Clear all</button><div style="flex:1"></div><button class="btn-primary" onclick="advApply()">Apply</button></div>`);
}
function advAdd(){state.advFilters.push({field:'lien_holder',op:'contains',value:''});renderAdvModal();}
function advRemove(i){state.advFilters.splice(i,1);renderAdvModal();}
function advOp(i,op){state.advFilters[i].op=op;renderAdvModal();}
function advClear(){state.advFilters=[];closeModal();render();}
function advApply(){state.advFilters=state.advFilters.filter(f=>f.op==='empty'||f.op==='not_empty'||(f.value||'').trim()!=='');closeModal();render();}

/* ---------- export ---------- */
function exportCSV(which){
  const rows=which==='selected'?state.rows.filter(r=>state.selected.has(r.id)):filtered();
  if(!rows.length)return alert('Nothing to export.');
  const cols=['first_name','last_name','home_phone','cell_phone','email','sale_date','sale_type','veh_year','veh_make','veh_model','vin','vin_last6','first_payment_date','note_payment_amount','pay_schedule','num_payments','current_due_date','service_contract','service_contract_company','lien_holder','cobuyer_first','cobuyer_last','cobuyer_home_phone','cobuyer_email','tag_in','tag_cost','tag_number'];
  const esc2=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const csv=[cols.join(',')].concat(rows.map(r=>cols.map(c=>esc2(r[c])).join(','))).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='sold_customers_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}
